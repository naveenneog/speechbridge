# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: speechbridge
metadata:
  template: speechbridge@1.0.0

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Built by Azure Container Registry, not locally, so deploying this needs no Docker
      # installed. That is what keeps "one command" true on a plain developer machine.
      remoteBuild: true

hooks:
  # Creates the Microsoft Entra app registration and turns on built-in authentication, so
  # `azd up` yields a site only your organisation can open. It runs after provisioning
  # because the redirect URI needs the site hostname, which does not exist before then.
  postprovision:
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: false
      continueOnError: true
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: false
      continueOnError: true

  # `azd down` deletes ARM resources, and an app registration is not one. Without this,
  # every deploy/destroy cycle would leave another orphan behind in the tenant.
  predown:
    posix:
      shell: sh
      run: ./scripts/predown.sh
      interactive: false
      continueOnError: true
    windows:
      shell: pwsh
      run: ./scripts/predown.ps1
      interactive: false
      continueOnError: true
